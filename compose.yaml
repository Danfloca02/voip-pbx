# If you need more help, visit the Docker Compose reference guide at
# https://docs.docker.com/go/compose-spec-reference/

# Here the instructions define your application as a service called "app".
# This service is built from the Dockerfile in the current directory.
# You can add other services your application may depend on here, such as a
# database or a cache. For examples, see the Awesome Compose repository:
# https://github.com/docker/awesome-compose
services:
  app:
    build:
      context: .
    container_name: novalink-voip-pbx
    # Red en modo host: el contenedor usa la pila de red del servidor, sin NAT
    # de Docker por medio. Es la forma recomendada de desplegar Asterisk en un
    # servidor Linux (docs/TRONCALES.md §2.4.2), por tres motivos:
    #
    #   1. Conserva la IP de ORIGEN, sin la cual 'type=identify' no funciona.
    #   2. El rango RTP no se publica puerto a puerto, asi que ampliarlo sale
    #      gratis: solo se toca rtp.conf.
    #   3. El trafico entra por la cadena INPUT, donde ufw/firewalld SI mandan.
    #      En modo bridge Docker inserta su DNAT antes y se salta el firewall.
    #
    # Con host networking no se declara 'ports:': los puertos que abre Asterisk
    # (5060/udp y el rango de rtp.conf) quedan expuestos directamente, y el
    # control de acceso pasa a ser del firewall del servidor.
    #
    # En Windows con Docker Desktop esto NO funciona: el motor corre en su
    # propia VM y 'host' seria la red de esa VM. Para desarrollo en Windows,
    # usar el bloque 'ports:' de docs/TRONCALES.md §2.3 en su lugar.
    network_mode: host

    volumes:
      - ./config/etc/asterisk:/etc/asterisk
    # secrets:
    #   db-password:
    #     file: db/password.txt
    restart: unless-stopped