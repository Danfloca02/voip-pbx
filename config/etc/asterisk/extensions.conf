; Plan de marcado. Plan de numeracion: 1XXX Caracas, 2XXX Maracaibo,
; 3XXX Valencia, 4XXX Barinas, 5XXX Puerto La Cruz.
[general]
static=yes
writeprotect=no

[globals]
TIMEOUT_LLAMADA=20

;Para escribir en CDR el resultado de la funcion rtpqos() de Asterisk, que indica QoS de la llamada. 
;Se puede ver en el CLI con "rtpqos show channels".
[qos-handler]
exten => s,1,NoOp(QOS: ${CHANNEL(rtpqos,audio,all)})
 same => n,Set(CDR(userfield)=${CHANNEL(rtpqos,audio,all)})
 same => n,Return()

;=============================================================================
; CONTEXTO DE LAS EXTENSIONES
[llamadas_internas]
include => salientes_troncal_sip

; Desvio: *72<destino> activa, *73 desactiva. Se guarda en AstDB.
exten => _*72X.,1,NoOp(Desvio ${CALLERID(num)} -> ${EXTEN:3})
 same => n,Set(DB(CF/${CALLERID(num)})=${EXTEN:3})
 same => n,Playback(beep)
 same => n,Hangup()

exten => *73,1,NoOp(Desvio anulado para ${CALLERID(num)})
 same => n,Set(NADA=${DB_DELETE(CF/${CALLERID(num)})})
 same => n,Playback(beep)
 same => n,Hangup()

; Buzon de voz: *97 el propio, *98 pregunta, *98<ext> uno concreto.
exten => *97,1,VoiceMailMain(${CALLERID(num)}@default)
 same => n,Hangup()

exten => *98,1,VoiceMailMain()
 same => n,Hangup()

exten => _*98X.,1,VoiceMailMain(${EXTEN:3}@default)
 same => n,Hangup()

; Sala de conferencia. Gana sobre el _8X. de la troncal por ser literal.
exten => 800,1,NoOp(Conferencia 800)
 same => n,ConfBridge(800,default_bridge,default_user)
 same => n,Hangup()

; Llamada a extension. Aplica desvio si existe y cae al buzon si no contesta.
; 'tT' autoriza la transferencia por DTMF (codigos en features.conf).
exten => _[1-5]XXX,1,NoOp(Interna ${CALLERID(num)} -> ${EXTEN})
 same => n,Set(DESTINO=${EXTEN})
 same => n,Set(DESVIO=${DB(CF/${EXTEN})})
 same => n,ExecIf($["${DESVIO}" != ""]?Set(DESTINO=${DESVIO}))
 same => n,Dial(PJSIP/${DESTINO},${TIMEOUT_LLAMADA},tT)
 ; Sin este GotoIf, el que llama cae al buzon despues de una llamada normal.
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?fin)
 same => n,VoiceMail(${EXTEN}@default,u)
 same => n(fin),Hangup()

;=============================================================================
; SALIDAS POR TRONCAL
;=============================================================================
; El prefijo se quita con ${EXTEN:1}: marcar 82001 sale como 2001.
[salientes_troncal_sip]
exten => _8X.,1,NoOp(Saliente troncal -> ${EXTEN:1})
 same => n,Dial(PJSIP/${EXTEN:1}@trunk_sip,${TIMEOUT_LLAMADA},tT)
 same => n,Hangup()

;=============================================================================
; ENTRADAS DE TRONCAL
;=============================================================================
; Entre sedes se envia la extension COMPLETA, sin prefijo.
[entrantes_troncal_sip]
exten => _[1-5]XXX,1,NoOp(Entrante troncal -> ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},${TIMEOUT_LLAMADA},tT)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?fin)
 same => n,VoiceMail(${EXTEN}@default,u)
 same => n(fin),Hangup()

exten => 800,1,ConfBridge(800,default_bridge,default_user)
 same => n,Hangup()

exten => _X.,1,NoOp(Destino desconocido: ${EXTEN})
 same => n,Hangup()
