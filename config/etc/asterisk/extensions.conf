[llamadas_internas]
include => salientes_redpublica
include => salientes_troncal_sip

; Activar desvio, Marcar *72 seguido del destino 
exten => _*72X.,1,NoOp(Activando desvio para ${CALLERID(num)} hacia ${EXTEN:3})
 same => n,Set(DB(CF/${CALLERID(num)})=${EXTEN:3})
 same => n,Playback(beep)
 same => n,Hangup()

; Desactivar desvio, Marcar *73
exten => *73,1,NoOp(Desactivando desvio para ${CALLERID(num)})
 same => n,Set(borrado=${DB_DELETE(CF/${CALLERID(num)})})
 same => n,Playback(beep)
 same => n,Hangup()

;Sala de Conferencia
exten => 800,1,NoOp(Entrando a la sala de conferencia comunitaria)
 same => n,ConfBridge(800,default_bridge,default_user)
 same => n,Hangup()

; Logica de enrutamiento interna
exten => _[1-5]XXX,1,NoOp(Llamada entrante a ${EXTEN})
 same => n,Set(DESVIO=${DB(CF/${EXTEN})}) ; Consulta la base de datos
 same => n,GotoIf($["${DESVIO}" != ""]?desviada:normal)
 
 same => n(normal),Dial(PJSIP/${EXTEN},20)
 same => n,VoiceMail(${EXTEN}@default,u)
 same => n,Hangup()
 
 same => n(desviada),NoOp(Llamada desviada a ${DESVIO})
 same => n,Dial(PJSIP/${DESVIO},20)
 same => n,VoiceMail(${DESVIO}@default,u)
 same => n,Hangup()

; Buzones de Voz
exten => *97,1,VoiceMailMain(${CALLERID(num)}@default)
 same => n,Hangup()

exten => *98,1,VoiceMailMain()
 same => n,Hangup()

exten => _*98X.,1,VoiceMailMain(${EXTEN:3}@default)
 same => n,Hangup()
 
[salientes_redpublica]
exten => _9X.,1,NoOp(Saliente red publica: ${CALLERID(num)} -> ${EXTEN:1})
 same => n,Dial(PJSIP/${EXTEN:1}@trunk_redpublica,20)
 same => n,Hangup()

; Idem con el 8 para la troncal SIP.
[salientes_troncal_sip]
exten => _8X.,1,NoOp(Saliente troncal SIP: ${CALLERID(num)} -> ${EXTEN:1})
 same => n,Dial(PJSIP/${EXTEN:1}@trunk_sip,20)
 same => n,Hangup()

[entrantes_redpublica]
; Si el proveedor entrega el numero marcado (DID) en ${EXTEN} y ese numero
; coincide con una extension interna, se timbra directo.
exten => _[1-5]XXX,1,NoOp(Entrante red publica -> extension ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},20)
 same => n,Hangup()

exten => _X.,1,NoOp(Entrante red publica sin DID mapeado: ${EXTEN})
 same => n,Dial(PJSIP/1001,20)
 same => n,Hangup()

[entrantes_troncal_sip]
exten => _[1-5]XXX,1,NoOp(Entrante troncal SIP -> extension ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},20)
 same => n,Hangup()

exten => _X.,1,NoOp(Entrante troncal SIP con destino desconocido: ${EXTEN})
 same => n,Hangup()
