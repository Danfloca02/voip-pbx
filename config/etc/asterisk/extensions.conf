[llamadas_internas]

include => salientes_redpublica
include => salientes_troncal_sip

; NOTA (pendiente 4.7): este patron asume que TODAS las extensiones 1XXX-5XXX
; viven en esta misma instancia de Asterisk. Cuando existan PBX por sede, los
; rangos 2XXX-5XXX deberan enrutarse por troncal en lugar de marcarse local.
exten => _[1-5]XXX,1,NoOp(Interna: ${CALLERID(num)} -> ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},20)
 same => n,Hangup()

[salientes_redpublica]
exten => _9X.,1,NoOp(Saliente red publica: ${CALLERID(num)} -> ${EXTEN:1})
 same => n,Dial(PJSIP/${EXTEN:1}@trunk_redpublica,20)
 same => n,Hangup()

; Idem con el 8 para la troncal SIP.
[salientes_troncal_sip]
exten => _8X.,1,NoOp(Saliente troncal SIP: ${CALLERID(num)} -> ${EXTEN:1})
 same => n,Dial(PJSIP/${EXTEN:1}@trunk_sip,20)
 same => n,Hangup()

[entrantes_redpublica]
; Si el proveedor entrega el numero marcado (DID) en ${EXTEN} y ese numero
; coincide con una extension interna, se timbra directo.
exten => _[1-5]XXX,1,NoOp(Entrante red publica -> extension ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},20)
 same => n,Hangup()

exten => _X.,1,NoOp(Entrante red publica sin DID mapeado: ${EXTEN})
 same => n,Dial(PJSIP/1001,20)
 same => n,Hangup()

[entrantes_troncal_sip]
exten => _[1-5]XXX,1,NoOp(Entrante troncal SIP -> extension ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},20)
 same => n,Hangup()

exten => _X.,1,NoOp(Entrante troncal SIP con destino desconocido: ${EXTEN})
 same => n,Hangup()
