[general]
; Asterisk usa un puerto PAR para RTP y el IMPAR siguiente para RTCP. Con
; direct_media=no la PBX puentea el audio, asi que CADA llamada consume DOS
; streams (una pata por lado): el rango de abajo da de sobra para produccion.
;
; Rango y firewall tienen que coincidir. Al cambiarlo hay que abrir el rango
; nuevo en ufw/firewalld Y en el grupo de seguridad del proveedor cloud, si lo
; hay (docs/TRONCALES.md §2.4.2).
;
; OJO en modo bridge ('ports:' en vez de network_mode: host): ahi cada puerto
; publicado es un listener, y publicar 10.000 es inviable. Si se despliega en
; bridge hay que reducir este rango y replicarlo en compose.yaml.
rtpstart=10000
rtpend=20000
