[general]
; Asterisk usa un puerto PAR para RTP y el IMPAR siguiente para RTCP, y con
; direct_media=no cada llamada consume DOS streams (una pata por lado).
; 10000-10020 = 11 pares = ~5 llamadas simultaneas. Suficiente para pruebas.
;
; Este rango tiene que coincidir con TRES sitios:
;   1. las reglas del firewall (Windows o ufw/firewalld)
;   2. 'ports:' de compose.override.yaml, SOLO en modo bridge
;   3. el grupo de seguridad del cloud, si lo hay
;
; En el servidor Linux con network_mode: host se puede subir a 10000-20000 sin
; coste: no hay publicacion puerto a puerto. En bridge NO subirlo, porque cada
; puerto publicado es un proceso proxy. Ver docs/TRONCALES.md §2.4.2
rtpstart=10000
rtpend=10020
