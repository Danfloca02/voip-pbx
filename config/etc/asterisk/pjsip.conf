; El transporte y las IPs propias van en pjsip_local.conf (no versionado).
#include "pjsip_local.conf"

;=============================================================================
; CODECS
;=============================================================================
[codec-interno](!)
disallow=all
allow=g722      ; HD en LAN
allow=ulaw
allow=alaw

[codec-troncal](!)
disallow=all
allow=ulaw      ; denominador comun de toda troncal
allow=alaw

;=============================================================================
; PLANTILLAS DE EXTENSION
;=============================================================================
; Sin 'transport=': acepta UDP y TLS. Para exigir TLS usar endpoint-interno-tls.
[endpoint-interno](!,codec-interno)
type=endpoint
context=llamadas_internas
direct_media=no         ; el RTP pasa siempre por la PBX
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
rtp_keepalive=15
rtp_timeout_hold=900

; Variante cifrada: señalizacion TLS + voz SRTP(SDES).
; SDES, no DTLS: MicroSIP y Zoiper de escritorio no hablan DTLS-SRTP.
; Requiere 5061/tcp abierto y el softphone con Transport=TLS.
[endpoint-interno-tls](!,endpoint-interno)
transport=transport-tls
media_encryption=sdes

[aor-interno](!)
type=aor
max_contacts=3

[auth-interno](!)
type=auth
auth_type=userpass

;=============================================================================
; EXTENSIONES
;=============================================================================
; Para añadir una: copiar los tres bloques y cambiar el numero.
; Para que sea cifrada: usar (endpoint-interno-tls) en el primer bloque.
; CAMBIAR las claves antes de exponer el 5060 fuera de la LAN.

[1001](endpoint-interno)
aors=1001
auth=1001-auth
callerid=Extension 1001 <1001>

[1001](aor-interno)

[1001-auth](auth-interno)
username=1001
password=1001

[1002](endpoint-interno)
aors=1002
auth=1002-auth
callerid=Extension 1002 <1002>

[1002](aor-interno)

[1002-auth](auth-interno)
username=1002
password=1002

;=============================================================================
; TRONCALES
;=============================================================================
[endpoint-troncal](!,codec-troncal)
type=endpoint
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
rtp_timeout=60
rtp_timeout_hold=900
; 'context' se define en cada troncal, no aqui.

; Plantillas de AOR: responden a "a donde envio yo". El 'contact' va en cada
; troncal concreta, NO aqui, o toda troncal heredaria la misma IP.
[aor-troncal-lan](!)
type=aor
qualify_frequency=60
qualify_timeout=3.0

[aor-troncal-externa](!)
type=aor
qualify_frequency=60
qualify_timeout=5.0

; El otro extremo no tiene IP fija y se registra contra esta PBX.
[aor-troncal-dinamica](!)
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=60

;--- trunk_sip (prefijo 8): troncal hacia la otra sede -----------------------
; Simetrica: la otra PBX necesita su bloque equivalente apuntando aqui.
; Elegir UNA variante segun el entorno.

; ===========================================================================
; VARIANTE A — ENTREGA: servidor Linux, network_mode: host, IPs publicas fijas
; ===========================================================================
; Autenticacion por IP de origen. Sin claves, sin registro, sin caducidad.
; Requiere que la IP de origen llegue intacta, o sea network_mode: host.
; Descomentar y sustituir IP_DE_LA_OTRA_SEDE por su IP publica.
;
;[trunk_sip](endpoint-troncal)
;context=entrantes_troncal_sip
;aors=trunk_sip
;
;[trunk_sip](aor-troncal-externa)
;contact=sip:IP_DE_LA_OTRA_SEDE:5060
;
; El identify es el UNICO control de acceso: el match debe ser una IP exacta,
; nunca una red amplia ni la gateway de Docker.
;[trunk_sip]
;type=identify
;endpoint=trunk_sip
;match=IP_DE_LA_OTRA_SEDE

; ===========================================================================
; VARIANTE B — DESARROLLO en Windows con Docker Desktop
; ===========================================================================
; Ahi la IP de origen llega reescrita como 172.17.0.1 y 'identify' nunca casa:
; las salientes funcionan y las entrantes se rechazan como anonimas.
; Esta variante autentica por usuario/clave, que no depende de la IP.
; Asimetrica: UN lado hace de servidor y el otro se registra contra el.
;
; Reglas que provocan el 90% de los fallos:
;   - 'client_uri' y 'from_user' llevan el NOMBRE DEL BLOQUE del otro lado
;     (aqui 'trunk_sip'), NO el usuario de la credencial.
;   - username y password deben ser IDENTICOS en los dos ficheros.
;   - un solo bloque auth, referenciado desde auth=, outbound_auth= y el registro.
;
; --- Lado SERVIDOR (no lleva type=registration) ---
[trunk_sip](endpoint-troncal)
context=entrantes_troncal_sip
aors=trunk_sip
auth=trunk_sip-auth            ; exijo credenciales a quien me llame
outbound_auth=trunk_sip-auth   ; y respondo si me las exigen
identify_by=username           ; por el From, no por IP
from_user=trunk_sip

[trunk_sip](aor-troncal-dinamica)   ; sin contact: se aprende del REGISTER

[trunk_sip-auth]
type=auth
auth_type=userpass
username=trunk_sip
password=CLAVE_LARGA_Y_ALEATORIA     ; openssl rand -base64 24
;
; --- Lado CLIENTE (igual, pero con contact fijo y el registro) ---
;[trunk_sip](aor-troncal-lan)
;contact=sip:IP_DEL_SERVIDOR:5060
;
;[trunk_sip-reg]
;type=registration
;transport=transport-udp
;outbound_auth=trunk_sip-auth
;server_uri=sip:IP_DEL_SERVIDOR              ; a donde mando el REGISTER
;client_uri=sip:trunk_sip@IP_DEL_SERVIDOR    ; mi identidad EN ese servidor
;retry_interval=60
;expiration=120                  ; corto: mantiene abierto el NAT
;max_retries=0                   ; reintentar siempre
;auth_rejection_permanent=no     ; no rendirse si la clave falla
