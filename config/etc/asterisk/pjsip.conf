; Extensiones y troncales. Identico en todas las maquinas.
; El transporte y las IPs propias van en pjsip_local.conf (no versionado).
; Guia: docs/DESPLIEGUE.md

#include "pjsip_local.conf"

;=============================================================================
; CODECS
;=============================================================================
[codec-interno](!)
disallow=all
allow=g722      ; HD en LAN
allow=ulaw
allow=alaw

[codec-troncal](!)
disallow=all
allow=ulaw      ; denominador comun de toda troncal
allow=alaw

;=============================================================================
; PLANTILLAS DE EXTENSION
;=============================================================================
; Sin 'transport=': acepta UDP y TLS. Para exigir TLS usar endpoint-interno-tls.
[endpoint-interno](!,codec-interno)
type=endpoint
context=llamadas_internas
direct_media=no         ; el RTP pasa siempre por la PBX
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
rtp_keepalive=15
rtp_timeout_hold=900

; Variante cifrada: señalizacion TLS + voz SRTP(SDES).
; SDES, no DTLS: MicroSIP y Zoiper de escritorio no hablan DTLS-SRTP.
; Requiere 5061/tcp abierto y el softphone con Transport=TLS.
[endpoint-interno-tls](!,endpoint-interno)
transport=transport-tls
media_encryption=sdes

[aor-interno](!)
type=aor
max_contacts=1

[auth-interno](!)
type=auth
auth_type=userpass

;=============================================================================
; EXTENSIONES
;=============================================================================
; Para añadir una: copiar los tres bloques y cambiar el numero.
; Para que sea cifrada: usar (endpoint-interno-tls) en el primer bloque.
; CAMBIAR las claves antes de exponer el 5060 fuera de la LAN.

[1001](endpoint-interno)
aors=1001
auth=1001-auth
callerid=Extension 1001 <1001>

[1001](aor-interno)

[1001-auth](auth-interno)
username=1001
password=1001

[1002](endpoint-interno)
aors=1002
auth=1002-auth
callerid=Extension 1002 <1002>

[1002](aor-interno)

[1002-auth](auth-interno)
username=1002
password=1002

;=============================================================================
; TRONCALES
;=============================================================================
[endpoint-troncal](!,codec-troncal)
type=endpoint
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
rtp_timeout=60
rtp_timeout_hold=900
; 'context' se define en cada troncal, no aqui.

; Plantillas de AOR: responden a "a donde envio yo". El 'contact' va en cada
; troncal concreta, NO aqui, o toda troncal heredaria la misma IP.
[aor-troncal-lan](!)
type=aor
qualify_frequency=60
qualify_timeout=3.0

[aor-troncal-externa](!)
type=aor
qualify_frequency=60
qualify_timeout=5.0

; El otro extremo no tiene IP fija y se registra contra esta PBX.
[aor-troncal-dinamica](!)
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=60

;--- trunk_sip (prefijo 8): otra PBX propia ----------------------------------
; VARIANTE A — misma LAN, autenticacion por IP. Simetrica: la otra PBX
; necesita su bloque equivalente apuntando aqui.
; NO funciona con Docker Desktop: reescribe la IP de origen a 172.17.0.1 y
; 'match' nunca casa. Usar la variante B ahi. Detalle: docs/DESPLIEGUE.md
;[trunk_sip](endpoint-troncal)
;context=entrantes_troncal_sip
;aors=trunk_sip
;
;[trunk_sip](aor-troncal-lan)
;contact=sip:IP_DE_LA_OTRA_PBX:5060
;
;[trunk_sip]
;type=identify
;endpoint=trunk_sip
;match=IP_DE_LA_OTRA_PBX

; VARIANTE B — usuario/clave. Funciona en cualquier red y con NAT.
; Esta PBX hace de SERVIDOR; la otra se registra contra ella.
; La otra necesita ademas un [trunk_sip-reg] type=registration.
;[trunk_sip](endpoint-troncal)
;context=entrantes_troncal_sip
;aors=trunk_sip
;auth=trunk_sip-auth
;
;[trunk_sip](aor-troncal-dinamica)
;
;[trunk_sip-auth]
;type=auth
;auth_type=userpass
;username=CAMBIAR_USUARIO
;password=CAMBIAR_CLAVE_LARGA

;--- trunk_redpublica (prefijo 9): proveedor SIP comercial -------------------
;[trunk_redpublica](endpoint-troncal)
;context=entrantes_redpublica
;aors=trunk_redpublica
;outbound_auth=trunk_redpublica-auth
;from_user=USUARIO_SIP
;from_domain=HOST_DEL_PROVEEDOR
;
;[trunk_redpublica](aor-troncal-externa)
;contact=sip:HOST_DEL_PROVEEDOR:5060
;
;[trunk_redpublica-auth]
;type=auth
;auth_type=userpass
;username=USUARIO_SIP
;password=CLAVE_SIP
;
; Solo si esta PBX no tiene IP publica fija.
;[trunk_redpublica-reg]
;type=registration
;transport=transport-udp
;outbound_auth=trunk_redpublica-auth
;server_uri=sip:HOST_DEL_PROVEEDOR
;client_uri=sip:USUARIO_SIP@HOST_DEL_PROVEEDOR
;retry_interval=60
;
;[trunk_redpublica]
;type=identify
;endpoint=trunk_redpublica
;match=IP_DEL_PROVEEDOR
