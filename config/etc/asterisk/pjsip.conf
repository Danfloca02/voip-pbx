#include "pjsip_local.conf"

[transport-tls]
type=transport
protocol=tls
bind=0.0.0.0:5061
cert_file=/etc/asterisk/keys/asterisk.crt
priv_key_file=/etc/asterisk/keys/asterisk.key
method=tlsv1_2

[codec-interno](!)
disallow=all
allow=g722      ; HD audio (16 kHz, 64 kbps). Preferido en LAN entre sedes.
allow=ulaw      ; G.711 µ-law (64 kbps).
allow=alaw      ; G.711 A-law (64 kbps).

[codec-troncal](!)
disallow=all
allow=ulaw      ; Denominador común de prácticamente toda troncal PSTN/SIP.
allow=alaw

[endpoint-interno](!,codec-interno)
type=endpoint
context=llamadas_internas 
direct_media=no         ; el RTP siempre pasa por la PBX (necesario para
                        ; grabación, hold y captura con tcpdump).
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
rtp_timeout_hold=900    ; colgar tras 15 min sin RTP estando en hold
transport=transport-tls ; Forzar señalización TLS
;media_encryption=sdes   ; Forzar cifrado de voz SRTP
media_encryption=dtls
dtls_verify=fingerprint
dtls_cert_file=/etc/asterisk/keys/asterisk.crt
dtls_private_key=/etc/asterisk/keys/asterisk.key
dtls_setup=actpass
rtp_keepalive=15        

[aor-interno](!)
type=aor
max_contacts=1

[auth-interno](!)
type=auth
auth_type=userpass

; Con PJSIP pueden existir varias secciones con el mismo nombre siempre que el
; 'type' difiera: [1001] endpoint y [1001] aor son objetos distintos.

;--- Extensión 1001 (Sede Principal, Caracas)
[1001](endpoint-interno)
aors=1001
auth=1001-auth
callerid=Extension 1001 <1001>

[1001](aor-interno) ;Heredado de plantilla

[1001-auth](auth-interno)
username=1001
password=1001

;--- Extensión 1002 (Sede Principal, Caracas)
[1002](endpoint-interno)
aors=1002
auth=1002-auth
callerid=Extension 1002 <1002>

[1002](aor-interno)

[1002-auth](auth-interno)
username=1002
password=1002

;=============================================================================
; 5. TRONCALES  — PENDIENTE 4.2
;=============================================================================
; Guia completa de configuracion: docs/TRONCALES.md
; Los PLACEHOLDERS_EN_MAYUSCULAS se sustituyen y luego se descomenta el bloque.
; Dejar una troncal activa apuntando a un host inexistente llena el log de
; fallos de qualify, asi que se descomenta solo cuando el otro extremo exista.

[endpoint-troncal](!,codec-troncal)
type=endpoint
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
rtp_timeout=60          ; cortar tras 60 s sin RTP en llamada activa
rtp_timeout_hold=900    ; cortar tras 15 min sin RTP en hold
; 'context' se define en cada troncal, no aqui: cada una entra a su contexto.
transport=transport-tls ; Señalización cifrada entre sedes
media_encryption=sdes   ; Voz cifrada entre sedes

;--- Plantillas de AOR -------------------------------------------------------
; El AOR responde a "a donde envio yo las llamadas". Hay tres casos segun
; donde este el otro extremo y si tiene IP fija.

; Caso 1: la otra PBX esta en la MISMA LAN. IP fija conocida, latencia baja.
[aor-troncal-lan](!)
type=aor
qualify_frequency=60
qualify_timeout=3.0
contact=sip:192.168.0.10:5060
;contact=sip:IP_LAN_DE_LA_OTRA_PBX:5060      ; ej. sip:192.168.1.20:5060

; Caso 2: el otro extremo esta FUERA de la LAN, con IP publica o dominio fijo.
; Timeout mas holgado por la latencia de internet.
[aor-troncal-externa](!)
type=aor
qualify_frequency=60
qualify_timeout=5.0

; Caso 3: el otro extremo NO tiene IP fija y se REGISTRA contra esta PBX
; (esta PBX hace de servidor). No lleva 'contact': la direccion se aprende
; del REGISTER. Requiere 'auth=' en el endpoint, porque sin IP fija el
; identify por IP no sirve como control de acceso.
[aor-troncal-dinamica](!)
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=60

