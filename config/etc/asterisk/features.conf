; Codigos DTMF durante una llamada. Solo funcionan si el Dial() lleva 't' o 'T'
; (ver extensions.conf). El boton "Transfer" del softphone usa SIP REFER y
; funciona sin esto.

[general]
transferdigittimeout => 5      ; segundos para marcar el destino
atxfernoanswertimeout => 15
atxferdropcall => no           ; si nadie contesta, vuelve con quien llamo
featuredigittimeout => 1000    ; ms entre digitos de un codigo

[featuremap]
; No usar codigos que empiecen por * : chocan con *72/*73/*97/*98.
blindxfer => #1                ; transferencia ciega
atxfer => #2                   ; transferencia consultada
disconnect => #9               ; colgar solo tu lado

[applicationmap]
